services:
  - type: web
    name: shadow-hunters
    env: node
    region: frankfurt
    plan: free
    buildCommand: "npm install --include=dev && npm run build && cd packages/server && npx prisma db push --accept-data-loss --skip-generate"
    startCommand: "cd packages/server && npm start"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 3001
      - key: SESSION_SECRET
        generateValue: true
      - key: LOBBY_PASSWORD
        value: EDGAR
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false