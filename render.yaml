services:
  - type: web
    name: shadow-hunters
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 1 --timeout 120 shadow-hunters.app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: "INFO"