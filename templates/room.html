<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shadow Hunters — Room</title>
  <style>
    /* minimal styling so the layout matches expectations */
    body, html { height:100%; margin:0; font-family: Palatino, "Times New Roman", Times; background:#111; color:#fff; }
    .bg { background-image: url('/static/gfx/waitRoom.svg'); background-position:center; background-repeat:no-repeat; background-size:cover; min-height:100vh; }
    .nav { list-style:none; margin:0; padding:10px 20px; display:flex; gap:10px; align-items:center; }
    .container { position: relative; max-width: 1066px; margin: 0 auto; padding-top: 10px; }
    #chatbox { position: absolute; right: 10px; top: 80px; width: 300px; background: rgba(255,255,255,0.06); padding:8px; border-radius:6px; }
    #players-list { position: absolute; left: 10px; top: 80px; width: 200px; background: rgba(255,255,255,0.06); padding:8px; border-radius:6px; }
    #players-list h3 { margin:0 0 8px 0; font-size:14px; border-bottom:1px solid #444; padding-bottom:4px; color:#fff; }
    #members-list { list-style:none; padding:0; margin:0; max-height:220px; overflow-y:auto; }
    #members-list li { padding:4px 0; border-bottom:1px solid #222; font-size:13px; color:#ddd; }
    #board { width: 800px; height: 600px; margin: 8px auto; background: transparent; }

    /* --- Error popup overlay --- */
    #error-popup {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    #error-popup .panel {
      background: #fff;
      color: #000;
      padding: 20px 28px;
      border-radius: 8px;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #error-popup .panel p { margin: 0 0 16px 0; font-size: 15px; line-height: 1.5; }
    #error-popup .panel button {
      background: #3f2b6d; color: #fff; border: none;
      padding: 8px 18px; border-radius: 4px; cursor: pointer;
      font-size: 14px;
    }
    #error-popup .panel button:hover { background: #5a418a; }
  </style>
</head>
<body>
  <div class="bg">
    <ul class="nav">
      <li><a href="/"><img src="/static/gfx/home.png" width="72" alt="Home"></a></li>
      <li><a href="/"><img src="/static/gfx/logo.png" alt="Logo"></a></li>
      <li><a href="/rules"><img src="/static/gfx/rules.png" width="72" alt="Rules"></a></li>
    </ul>

    <div class="container">
      <!-- Expose Flask context to client JS -->
      <script>var usrctx = {{ context | tojson | safe }};</script>

      <div id="startButton">
        <form id="start" onsubmit="return false;"><input id="start-game" type="submit" class="start" value="Start Game"/></form>
      </div>

      <form id="selectPlayers" onsubmit="return false;">
        <select id="nPlayers">
          <option value="4">4 Players</option>
          <option value="5" selected>5 Players</option>
          <option value="6">6 Players</option>
          <option value="7">7 Players</option>
          <option value="8">8 Players</option>
        </select>
      </form>

      <div id="board"></div>

      <div id="chatbox">
        <div id="message_holder" style="height:260px; overflow:auto;"></div><br>
        <form id="chat" onsubmit="return false;">
          <input type="text" id="message" placeholder="message" autocomplete="off" style="width:70%"/>
          <input type="submit" class="send" value="Send"/>
        </form>
      </div>

      <div id="players-list">
        <h3>Joueurs connectés</h3>
        <ul id="members-list"></ul>
      </div>

      <!-- Interactive forms used by setup.js / game -->
      <form id="select" style="display:none" onsubmit="return false;"></form>
      <form id="confirm" style="display:none" onsubmit="return false;"></form>
      <form id="yesno" style="display:none" onsubmit="return false;"></form>
      <form id="reveal" style="display:none" onsubmit="return false;"><input type="submit" class="reveal" value="Reveal"/></form>
      <form id="special" style="display:none" onsubmit="return false;"><input type="submit" class="special" value="Special"/></form>
    </div>
  </div>

  <!-- Error popup (shown by setup.js on connect_error / disconnect / game_error / false_start) -->
  <div id="error-popup">
    <div class="panel">
      <p id="error-popup-msg"></p>
      <button id="error-popup-ok">OK</button>
    </div>
  </div>

  <!-- Load libs first -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

  <!-- Your game/client code -->
  <script src="/static/waitRoom.js"></script>
  <script src="/static/gameBoard.js"></script>
  <script src="/static/setup.js"></script>
</body>
</html>
