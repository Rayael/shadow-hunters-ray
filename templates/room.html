<body>
  <div class="bg">

    <ul class="nav">
      <a href="/" class="pull-left"><img src="/static/gfx/home.png" width="100"></a>
      <a href="/" class="pull-left"><img src="/static/gfx/logo.png"></a>
      <a href="/rules" target="_blank" class="pull-left"><img src="/static/gfx/rules.png" width="100"></a>
    </ul>

    <div class="container">
      <div id="startButton">
        <form id="start">
          <input id="start-game" type="submit" class="start" value="Start Game"/>
        </form>
      </div>
      <form id="selectPlayers">
        <select id="nPlayers">
          <option value="4"> 4 Players </option>
          <option value="5" selected> 5 Players </option>
          <option value="6"> 6 Players </option>
          <option value="7"> 7 Players </option>
          <option value="8"> 8 Players </option>
        </select>
      </form>
      <form id="select">
      </form>
      <form id="reveal">
        <input type="submit" class="reveal" value="Reveal"/>
      </form>
      <form id="special">
        <input type="submit" class="special" value="Special"/>
      </form>
      <div id="ingame">
        <form id="confirm">
        </form>
        <form id="yesno">
        </form>
      </div>
      <div id="board"></div>
      <div id="chatbox">
        <div id="message_holder"></div><br>
        <form id="chat">
          <input type="text" id="message" placeholder="message" autocomplete="off"/>
          <input type="submit" class="send" value="Send"/>
        </form>
      </div>
    </div>

  </div>
</body>
